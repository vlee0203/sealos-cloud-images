name: Build devbox-runtime-frameworks

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: vlee0203
  SEALOS_VERSION: "5.0.1"

jobs:
  build-part1:
    name: Build frameworks-part1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install sealos ${{ env.SEALOS_VERSION }}
        run: |
          curl -sL https://github.com/labring/sealos/releases/download/v${{ env.SEALOS_VERSION }}/sealos_${{ env.SEALOS_VERSION }}_linux_amd64.tar.gz | sudo tar -xz -C /usr/bin sealos
          sealos version

      - name: Sealos login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo sealos login -u ${{ github.repository_owner }} --password-stdin ghcr.io

      - name: Build and push frameworks-part1
        working-directory: devbox-runtime/frameworks/part1/deploy
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sealos-cloud-images/devbox-runtime-frameworks
          sudo sealos build -t ${IMAGE}:${TAG}-part1 --isolation=chroot --platform linux/amd64 -f Kubefile .
          sudo rm -rf registry
          PUSH=${{ github.event_name == 'push' || inputs.push_image == true }}

          if [ "$PUSH" = "true" ]; then
            sudo sealos push ${IMAGE}:${TAG}-part1
            echo "${IMAGE}:${TAG}-part1 push success"
          fi

  build-part2:
    name: Build frameworks-part2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install sealos ${{ env.SEALOS_VERSION }}
        run: |
          curl -sL https://github.com/labring/sealos/releases/download/v${{ env.SEALOS_VERSION }}/sealos_${{ env.SEALOS_VERSION }}_linux_amd64.tar.gz | sudo tar -xz -C /usr/bin sealos
          sealos version

      - name: Sealos login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo sealos login -u ${{ github.repository_owner }} --password-stdin ghcr.io

      - name: Build and push frameworks-part2
        working-directory: devbox-runtime/frameworks/part2/deploy
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sealos-cloud-images/devbox-runtime-frameworks
          sudo sealos build -t ${IMAGE}:${TAG}-part2 --isolation=chroot --platform linux/amd64 -f Kubefile .
          sudo rm -rf registry
          PUSH=${{ github.event_name == 'push' || inputs.push_image == true }}

          if [ "$PUSH" = "true" ]; then
            sudo sealos push ${IMAGE}:${TAG}-part2
            echo "${IMAGE}:${TAG}-part2 push success"
          fi
