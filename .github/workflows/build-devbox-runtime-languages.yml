name: Build devbox-runtime-languages

on:
  push:
    branches: [main]
    paths:
      - "devbox-runtime/languages/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  OWNER: vlee0203
  SEALOS_VERSION: "5.0.1"

jobs:
  build:
    name: Build devbox-runtime-languages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install sealos ${{ env.SEALOS_VERSION }}
        run: |
          curl -sL https://github.com/labring/sealos/releases/download/v${{ env.SEALOS_VERSION }}/sealos_${{ env.SEALOS_VERSION }}_linux_amd64.tar.gz | sudo tar -xz -C /usr/bin sealos
          sealos version

      - name: Sealos login to ghcr.io
        run: |
          sudo sealos login -u ${{ github.repository_owner }} -p ${{ secrets.GH_PAT }} ghcr.io

      - name: Build and push languages (amd64)
        working-directory: devbox-runtime/languages/deploy
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sealos-cloud-images/devbox-runtime-languages
          sudo sealos build -t ${IMAGE}:${TAG}-amd64 --platform linux/amd64 -f Kubefile .
          sudo sealos push ${IMAGE}:${TAG}-amd64
          sudo rm -rf registry

      - name: Build and push languages (arm64)
        working-directory: devbox-runtime/languages/deploy
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sealos-cloud-images/devbox-runtime-languages
          sudo sealos build -t ${IMAGE}:${TAG}-arm64 --platform linux/arm64 -f Kubefile .
          sudo sealos push ${IMAGE}:${TAG}-arm64
          sudo rm -rf registry

      - name: Create and push manifest
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sealos-cloud-images/devbox-runtime-languages
          PUSH=${{ github.event_name == 'push' || inputs.push_image == true }}

          if [ "$PUSH" = "true" ]; then
            sudo sealos manifest create ${IMAGE}:${TAG}
            sudo sealos manifest add ${IMAGE}:${TAG} docker://${IMAGE}:${TAG}-amd64
            sudo sealos manifest add ${IMAGE}:${TAG} docker://${IMAGE}:${TAG}-arm64
            sudo sealos manifest push --all ${IMAGE}:${TAG} docker://${IMAGE}:${TAG}

            sudo sealos tag ${IMAGE}:${TAG}-amd64 ${IMAGE}:latest-amd64
            sudo sealos tag ${IMAGE}:${TAG}-arm64 ${IMAGE}:latest-arm64
            sudo sealos push ${IMAGE}:latest-amd64
            sudo sealos push ${IMAGE}:latest-arm64

            sudo sealos manifest create ${IMAGE}:latest
            sudo sealos manifest add ${IMAGE}:latest docker://${IMAGE}:latest-amd64
            sudo sealos manifest add ${IMAGE}:latest docker://${IMAGE}:latest-arm64
            sudo sealos manifest push --all ${IMAGE}:latest docker://${IMAGE}:latest

            echo "${IMAGE}:${TAG} push success"
            echo "${IMAGE}:latest push success"
          fi
